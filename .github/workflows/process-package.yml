name: Generate Package PR

on:
  issues:
    types: [opened, labeled]

jobs:
  create-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout registry repository
        uses: actions/checkout@v4

      - name: Parse issue form
        uses: stefanbuck/github-issue-parser@v3
        id: issue-parser

      - name: Fetch manifest and update packages.json
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.issue.labels.map(l => l.name);
            if (!labels.includes('new-package')) {
              console.log("El issue no tiene la etiqueta 'new-package'. Ignorando...");
              return;
            }

            const fs = require('fs');
            const issueData = ${{ steps.issue-parser.outputs.jsonString }};
            const payload = issueData.payload;

            const pkgName = payload.package_name?.trim();
            const repoUrl = payload.repo_url?.trim();
            const issueNumber = context.payload.issue.number;

            if (!pkgName || !repoUrl) {
              console.error("Faltan campos obligatorios en el issue.");
              return;
            }

            const cleanRepoUrl = repoUrl.replace(/\/$/, "");
            const manifestUrl = cleanRepoUrl.replace("github.com", "raw.githubusercontent.com") + "/main/pkg.json";

            console.log(`Descargando manifiesto desde: ${manifestUrl}`);

            let manifest;
            try {
              const response = await fetch(manifestUrl);
              if (!response.ok) {
                throw new Error(`No se pudo obtener pkg.json (Código: ${response.status})`);
              }
              manifest = await response.json();
            } catch (error) {
              console.error("Error:", error.message);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `❌ Error automático: No se pudo leer el archivo \`pkg.json\` desde \`${manifestUrl}\`. Comprueba que la URL sea correcta y el archivo exista en la raíz.`
              });
              return;
            }

            const filePath = './packages.json';
            const fileContent = JSON.parse(fs.readFileSync(filePath, 'utf8'));

            fileContent.packages[pkgName] = {
              name: manifest.name || pkgName,
              version: manifest.version || "1.0.0",
              description: manifest.description || "",
              url: manifest.install
            };

            // ESCRITURA REAL EN EL DISCO DEL WORKFLOW
            fs.writeFileSync(filePath, JSON.stringify(fileContent, null, 2));
            console.log(`Paquete '${pkgName}' escrito correctamente en packages.json`);

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: add package from issue #${{ github.event.issue.number }}"
          title: "Add package: issue #${{ github.event.issue.number }}"
          body: |
            Automated Pull Request to add a new package requested in issue #${{ github.event.issue.number }}.
            
            Please review the changes in `packages.json` and merge if everything looks correct.
          branch: pkg-add-${{ github.event.issue.number }}
          base: main
          delete-branch: true
