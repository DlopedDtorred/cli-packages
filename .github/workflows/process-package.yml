name: Process Approved Package

on:
  issues:
    types: [labeled]

jobs:
  add-package:
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout registry repository
        uses: actions/checkout@v4

      - name: Parse issue form
        uses: stefanbuck/github-issue-parser@v3
        id: issue-parser

      - name: Fetch manifest and update packages.json
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issueData = ${{ steps.issue-parser.outputs.jsonString }};
            const payload = issueData.payload;

            const pkgName = payload.package_name?.trim();
            const repoUrl = payload.repo_url?.trim();

            if (!pkgName || !repoUrl) {
              console.error("Missing required fields in the issue.");
              return;
            }

            // Transform https://github.com/user/repo into raw content URL for pkg.json
            const cleanRepoUrl = repoUrl.replace(/\/$/, "");
            const manifestUrl = cleanRepoUrl.replace("github.com", "raw.githubusercontent.com") + "/main/pkg.json";

            console.log(`Fetching manifest from: ${manifestUrl}`);

            try {
              const response = await fetch(manifestUrl);
              if (!response.ok) {
                throw new Error(`Failed to fetch pkg.json (Status: ${response.status})`);
              }
              const manifest = await response.json();

              const filePath = './packages.json';
              const fileContent = JSON.parse(fs.readFileSync(filePath, 'utf8'));

              fileContent.packages[pkgName] = {
                name: manifest.name || pkgName,
                version: manifest.version || "1.0.0",
                description: manifest.description || "",
                url: manifest.install
              };

              fs.writeFileSync(filePath, JSON.stringify(fileContent, null, 2));
              console.log(`Package '${pkgName}' successfully registered!`);

            } catch (error) {
              console.error("Error processing manifest:", error.message);
              setFailed(error.message);
            }

      - name: Commit changes to registry
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-add approved package via manifest"
          branch: main
