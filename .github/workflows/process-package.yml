name: Procesar Paquete Aprobado

on:
  issues:
    types: [labeled]

jobs:
  add-package:
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Parsear formulario del Issue
        uses: stefanbuck/github-issue-parser@v3
        id: issue-parser

      - name: Actualizar packages.json
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issueData = ${{{{ steps.issue-parser.outputs.jsonString }}};
            const payload = issueData.payload;

            const pkgName = payload.package_name?.trim();
            const description = payload.description?.trim();
            const scriptUrl = payload.script_url?.trim();

            if (!pkgName || !scriptUrl) {
              console.error("Faltan datos obligatorios en el issue.");
              return;
            }

            const filePath = './packages.json';
            const fileContent = JSON.parse(fs.readFileSync(filePath, 'utf8'));

            fileContent.packages[pkgName] = {
              name: pkgName,
              description: description || "",
              url: scriptUrl
            };

            fs.writeFileSync(filePath, JSON.stringify(fileContent, null, 2));
            console.log(`Paquete '${pkgName}' añadido exitosamente.`);

      - name: Guardar cambios en el repositorio
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automático: añadir paquete desde issue aprobado"
          branch: main
